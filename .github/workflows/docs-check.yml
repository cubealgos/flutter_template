# Verification only — no deployment step in this file. Runs on a
# GitHub-hosted Linux runner (single, repeated `runs-on:` value — see ci.yml;
# prerequisites in `.github/RUNNER.md`). Toolchain: `.github/actions/setup`.
#
# `melos run docs-check` (dartdoc with `--validate-links` in every package
# with a `lib/`) is the slowest quick check, and no dartdoc flag makes it
# cheaper: `dart doc --dry-run` cannot combine with `--validate-links` and
# saves under 5 %. It used to be a step of the `ci` job; as its own
# workflow it runs in parallel with `ci` on another runner, so `ci` drops by the length of this check and a
# PR keeps the broken-link check. Same triggers and concurrency as the other
# workflows; no build_runner cache is needed (dartdoc reads committed
# sources only).

name: docs-check

on:
  push:
    branches: [development, production]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: docs-check
        run: dart run melos run docs-check
