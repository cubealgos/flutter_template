# Verification only — no deployment step in this file. Runs on a
# GitHub-hosted Linux runner (single, repeated `runs-on:` value — see ci.yml;
# prerequisites in `.github/RUNNER.md`). Toolchain: `.github/actions/setup`.
#
# The one pre-release check this repo runs a real browser for:
# builds apps/app and apps/website for web, then boots both in headless
# Chrome over the DevTools Protocol (core/tooling/tooling's `web_smoke`
# command) and fails on an uncaught JS exception, a console error, a web
# splash that never clears, missing localized content, or a serious/critical
# axe-core violation in the semantics DOM (axe is vendored, no download).
#
# `melos run web-smoke` includes `website:build` (`jaspr build`, static),
# so this job also covers what the old separate `website` workflow checked
# (a compile or static-rendering failure of apps/website); that workflow was
# removed rather than build the site twice.
#
# Chrome for Testing (not the distro `chromium` package), fetched and
# sha256-verified once into `$RUNNER_TOOL_CACHE/chrome-for-testing/`, then
# reused by every later run (same marker scheme as `.github/actions/setup`).
# `chrome-linux64.zip` (full Chrome), not `chrome-headless-shell-linux64.zip`.
# Chrome's runtime shared libraries are installed by the first step below
# (the list Chrome for Testing ships in its own `chrome-linux64/deb.deps`). Its own job: needs
# a browser and two web builds.
#
# `website:build` compiles apps/website through build_runner, which
# recompiles its builder snapshot on a cold checkout (checkout wipes
# `.dart_tool`) — hence the `actions/cache` for it, scoped to `apps/website`
# (the only package in this job's chain that uses build_runner;
# `web-smoke:build-app` is a plain `flutter build web`).

name: web-smoke

on:
  push:
    branches: [development, production]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Install Chrome runtime libraries
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-liberation libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 \
            libatspi2.0-0t64 libcairo2 libcups2t64 libcurl4t64 libdbus-1-3 libexpat1 libgbm1 \
            libglib2.0-0t64 libgtk-3-0t64 libnspr4 libnss3 libpango-1.0-0 libudev1 libvulkan1 \
            libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 \
            libxrandr2 xdg-utils unzip

      - name: Install or reuse Chrome for Testing
        shell: bash
        run: |
          set -eu
          CHROME_VERSION=154.0.8037.57
          CHROME_SHA256=ceee2972074d441ea7c4ba8bcc0eaab77e7e87680f6653d73d3065851fe10302
          root="$RUNNER_TOOL_CACHE/chrome-for-testing"
          dir="$root/${CHROME_VERSION}-${CHROME_SHA256:0:16}"
          mkdir -p "$root"
          (
            flock 9
            if [ "$(cat "$dir/.pinned-sha256" 2>/dev/null || true)" = "$CHROME_SHA256" ] \
                && [ -x "$dir/chrome-linux64/chrome" ]; then
              echo "Reusing Chrome for Testing $CHROME_VERSION at $dir"
            else
              echo "Installing Chrome for Testing $CHROME_VERSION into $dir"
              rm -rf "$dir"
              tmp=$(mktemp -d "$root/.install.XXXXXX")
              trap 'rm -rf "$tmp"' EXIT
              curl -fsSL -o "$tmp/chrome-linux64.zip" \
                "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chrome-linux64.zip"
              echo "${CHROME_SHA256}  $tmp/chrome-linux64.zip" | sha256sum -c -
              mkdir -p "$tmp/out"
              unzip -q "$tmp/chrome-linux64.zip" -d "$tmp/out"
              chmod +x "$tmp/out/chrome-linux64/chrome"
              mv "$tmp/out" "$dir"
              echo "$CHROME_SHA256" > "$dir/.pinned-sha256"
            fi
          ) 9>"$root/.lock"
          echo "CHROME=$dir/chrome-linux64/chrome" >> "$GITHUB_ENV"

      - name: Cache build_runner snapshot (apps/website)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/website/.dart_tool/build/entrypoint
          key: build-runner-${{ hashFiles('pubspec.lock', '**/build.yaml') }}

      - run: dart run melos run web-smoke
