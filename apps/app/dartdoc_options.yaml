dartdoc:
  # Promote a `[Reference]` that doesn't resolve, or a link dartdoc itself
  # generates to something that doesn't exist, from a warning to a build
  # failure — see the `docs-check` melos script in the root pubspec.yaml.
  errors:
    - unresolved-doc-reference
    - broken-link
  # slang's generated `lib/i18n/*.g.dart` (see slang.yaml — generated by the
  # `dart run slang` CLI, not build_runner) are the first generated
  # files in this workspace that are standalone libraries rather than
  # `part of` a hand-written one — every other
  # package's generated files (freezed/json_serializable/injectable/
  # go_router_builder/mockito) are `part of` files, invisible to dartdoc as
  # separate entities. slang's cross-references between its three generated
  # libraries (base/en/de) don't resolve under dartdoc 9.0.6, so they're
  # excluded here by dartdoc's own library-name identifier (distinct from
  # analysis_options.yaml's file-path-based `analyzer.exclude`).
  exclude:
    - strings.g
    - strings_de.g
    - di.config
