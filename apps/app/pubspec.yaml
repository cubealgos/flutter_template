name: app
description: "The flutter_template default app (clone target — rename via tooling:rename)."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
resolution: workspace

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  # Deliberately below the workspace's own ^3.13.0 (see root pubspec.yaml):
  # a package's `environment: sdk:` lower bound sets its *language
  # version*, and freezed 3.2.5's generated code for any List/Map/Set
  # field (`@Default`'d or not) emits a bare `final` on a non-`this.`
  # constructor parameter, which Dart 3.13's primary-constructor grammar
  # rejects (`extraneous_modifier: Can't have modifier 'final' here.` —
  # note `dart analyze` does NOT catch this on its own, since generated
  # files are excluded from analysis; it only surfaces when the code is
  # actually compiled, e.g. by `flutter test` or `flutter build`). This app
  # uses freezed for `AppConfig` and the sample feature's view models, so it
  # needs the same pin as `packages/domain` (see that package's pubspec.yaml
  # for the full reproduction notes, and CLAUDE.md's "add a freezed model"
  # row). Revert to `^3.13.0` once freezed >=4 is usable here.
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  # BSD-3-Clause (on the dependency-license allow list, matching
  # `backend/appwrite/adapters`'s pin). The app's own DI wiring
  # (`app/service_module.dart`) builds the shared `Client` instance and
  # passes it to `AppwriteAuthService`/`AppwriteDocumentRepository`/etc.,
  # so it needs this import directly rather than only transitively through
  # `appwrite_adapters`.
  appwrite: ^26.2.0
  appwrite_adapters:
    path: ../../backend/appwrite/adapters
  # MIT. `templateSchema` names the `profiles` table/`main` database
  # `app/backend_module.dart`'s `AppwriteDocumentRepository` registration
  # reads, so the app names them from the schema instead of duplicating
  # the literal IDs.
  appwrite_schema:
    path: ../../backend/appwrite/schema
  auth:
    path: ../../core/contracts/auth
  # The billing contract (`Billing`, `Entitlement`) the paywall reads and
  # starts a checkout through; `BackendModule` picks its adapter.
  billing:
    path: ../../core/contracts/billing
  data:
    path: ../../core/contracts/data
  flutter:
    sdk: flutter
  # MIT. Generates the native splash screen (Android incl. the
  # Android 12+ splash API, iOS, web) from assets/icon/icon_foreground.png
  # — config in flutter_native_splash.yaml; run via `dart run melos run
  # icons`. A runtime dependency, not dev: on web the generated
  # splash stays on top of the app until `FlutterNativeSplash.remove()`
  # (called from `main()`) runs `removeSplashFromWeb()`.
  flutter_native_splash: 2.4.8
  # MIT. Freezed's runtime annotations (`@freezed`, `@Default`, …) for
  # `AppConfig` and every feature's view models. Pinned to the exact
  # version `packages/domain` resolves to, matching freezed 3.2.5's
  # constraint — see freezed below.
  freezed_annotation: 3.1.0
  # MIT. The service locator `app/di.dart` configures and every controller
  # resolves its injected services from.
  get_it: 9.3.0
  # BSD-3-Clause (on the dependency-license allow list). Typed routes
  # (`@TypedGoRoute`, generated into `app/router.g.dart`) built by
  # go_router_builder below. Only `app/router.dart` and
  # `app/service_module.dart` may import this directly — everywhere else
  # reaches navigation through `mvc`'s `NavigationService`, enforced by
  # `core/architecture/mvc_lints`' view-boundary rules.
  go_router: ^18.0.1
  # MIT. Generates `app/di.config.dart`'s `GetIt` extension from the
  # `@injectable`/`@module` annotations in `app/di.dart` and
  # `app/service_module.dart`.
  injectable: 3.0.0
  # The single source for this app's Impressum/Datenschutz/AGB placeholder
  # legal-entity facts — pure Dart; `AppConfig`'s `legal*`
  # fields default to its constants. `apps/website` reads the same
  # package, so the two can never drift.
  legal_facts:
    path: ../../core/contracts/legal_facts
  # BSD-3-Clause (on the dependency-license allow list; same ^2.2.0 that
  # `core/design/ui` resolves to). Declared directly, not only transitively
  # via `ui`, because screens compose `Box`/`BoxStyler`/`StyledText` for
  # layout `ui` has no component for (onboarding's progress dots, spacing
  # between styled text lines); keeps `depend_on_referenced_packages` clean.
  mix: ^2.2.0
  mvc:
    path: ../../core/architecture/mvc
  # BSD-3-Clause (on the dependency-license allow list, matching
  # `core/design/ui`'s own pin). `NakedRadio`/`NakedRadioGroup` back the
  # Preferences step's radio rows — `core/design/ui` has no `AppRadio`
  # component yet (see `docs/design/tokens-needed.md`), so this feature
  # builds its own headless radio chrome the same way `AppCheckbox` does.
  naked_ui: ^1.0.1
  # MIT. Runtime for the generated `lib/i18n/strings.g.dart` — also
  # provides the `dart run slang` CLI this app generates it with (see
  # `slang.yaml` and the `gen:l10n` melos script in the root pubspec.yaml).
  slang: 4.19.2
  # MIT. Flutter glue for slang: `TranslationProvider`, and the `Locale`
  # conversion `app/app.dart` uses to follow the device locale.
  slang_flutter: 4.19.0
  # Team tenancy contract: `TeamService` and its models, which
  # `app/backend_module.dart` wires to Appwrite or the in-memory fake.
  teams:
    path: ../../core/contracts/teams
  ui:
    path: ../../core/design/ui

dev_dependencies:
  # Pinned to match `packages/domain`'s build_runner pin — a workspace-wide
  # single pub resolution needs one version for every workspace member (see
  # its pubspec.yaml for the full reasoning): newer build_runner releases
  # bump their own `analyzer` dependency past the ceiling freezed 3.2.5 (and
  # this package's other generators, below) tolerate.
  build_runner: 2.15.1
  # MIT. Generates Android (incl. adaptive/monochrome), iOS (incl.
  # dark/tinted), macOS, Windows and web launcher icons from
  # assets/icon/*.png — config in flutter_launcher_icons.yaml. Depends only
  # on args/checked_yaml/cli_util/image/json_annotation/path/yaml at
  # runtime (build_runner/json_serializable are its own dev_dependencies,
  # never pulled into this workspace's resolution) — no analyzer pin risk.
  # Run via `dart run melos run icons` (core/tooling/tooling's `icons`
  # command), never by hand.
  flutter_launcher_icons: 0.14.4
  flutter_test:
    sdk: flutter
  # Pinned to the analyzer 10.x line this workspace resolves to (see
  # `packages/domain/pubspec.yaml` and CLAUDE.md's "Toolchain" row): freezed
  # 3.2.5 depends on `analyzer: >=9.0.0 <11.0.0`. Pinned explicitly (not
  # `^3.2.5`) so a future freezed patch release can't silently change that
  # ceiling without a deliberate version bump here.
  freezed: 3.2.5
  # BSD-3-Clause. 4.5.0's own `analyzer: >=8.2.0 <15.0.0` stays inside the
  # workspace's resolved analyzer 10.x line.
  go_router_builder: 4.5.0
  # MIT. Pinned to the 3.0.x line the workspace plan calls for: 3.0.2's own
  # `analyzer: >=10.0.0 <13.0.0` stays inside the workspace's analyzer 10.x
  # line, whereas 3.1.1 (checked on pub.dev) tightens that to
  # `analyzer: >=13.0.0 <14.0.0`, which would break it.
  injectable_generator: 3.0.2
  # Apache-2.0. Pinned below 5.6.5: that release (and every one after it,
  # checked up to the current 5.8.1) bumped mockito's own `analyzer`
  # dependency to `^13.0.0`, which conflicts with freezed 3.2.5's
  # `analyzer: <11.0.0` ceiling — 5.6.4 is the newest release still on
  # `analyzer: >=8.1.1 <13.0.0`, compatible with the workspace's resolved
  # analyzer 10.x line. Used by every controller test's
  # `@GenerateNiceMocks`.
  mockito: 5.6.4
  # BSD-3-Clause. Rewrites the native Android/iOS/macOS/Linux/Windows/
  # web identity fields (applicationId/bundle id, display name, executable
  # name, ...) `core/tooling/tooling`'s `rename` command drives it through — see
  # that package's `rename_command.dart`. No `analyzer` dependency of its
  # own (its own pubspec.yaml depends only on args/html/logger/yaml — none
  # of which pin `analyzer`), so it can't move the workspace's analyzer
  # 10.x-13.x resolution; confirmed it resolves without a new
  # `dependency_overrides` entry (root pubspec.yaml's `cli_util: 0.6.0`
  # stays the only one — see its comment there). Run via
  # `fvm dart run tooling:rename`, never by hand.
  package_rename: 1.10.1
  # BSD-3-Clause (on the dependency-license allow list, matching every
  # other workspace member's own pin — see e.g.
  # `backend/appwrite/adapters/pubspec.yaml`). Used by
  # `test/web/account_deletion_page_test.dart` to locate the static
  # account-deletion page relative to this package's root.
  path: ^1.9.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # This template forbids Material widgets — the app root is a
  # `WidgetsApp.router`, not a `MaterialApp.router` (see `app/app.dart`) —
  # so no Material icon font is bundled here. `core/design/ui` (mix/naked_ui)
  # will add whatever icon set it actually needs.
  uses-material-design: false

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
