include: ../../analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - web/**
    # Generated by jaspr_builder (see main.server.dart's own doc comment) —
    # never hand-edited, same as the workspace's *.g.dart/*.freezed.dart
    # exclusions. Also works around a dartdoc quirk: a root-level file
    # whose own name contains a `.` (main.server.options.dart) confuses
    # dartdoc's file-path-based library-name inference when a sibling file
    # (main.server.dart) shares the same dotted prefix, producing a
    # spurious "broken link" from the package index page that `docs-check`
    # (`dart doc --validate-links`) then fails on.
    - lib/main.server.options.dart
