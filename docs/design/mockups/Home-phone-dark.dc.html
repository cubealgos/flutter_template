:root {

}
body { margin: 0; background: var(--ground); }

* { box-sizing: border-box; border-radius: 0; }
.chip-dot, .checkbox-box.circle { border-radius: 50%; }
html, body { margin: 0; padding: 0; }
.root { font-family: 'Host Grotesk', system-ui, sans-serif; }

.t-h3 { font: 600 16px/1.3 'Host Grotesk', system-ui, sans-serif; margin: 0; color: var(--ink); }
.t-body { font: 400 16px/1.6 'Host Grotesk', system-ui, sans-serif; margin: 0; color: var(--ink); }
.t-body-sm { font: 400 14px/1.5 'Host Grotesk', system-ui, sans-serif; margin: 0; color: var(--ink); }
.t-body-sm-muted { font: 400 14px/1.5 'Host Grotesk', system-ui, sans-serif; margin: 0; color: var(--muted); }

.t-eyebrow-signal { font: 600 14px/1.4 'Host Grotesk', system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.04em; margin: 0; color: var(--signal-light); }
.t-mono { font: 400 16px/1.4 'IBM Plex Mono', ui-monospace, monospace; margin: 0; color: var(--ink); }

a { color: var(--signal-light); }
a:hover { text-decoration: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 24px; font: 600 16px/1 'Host Grotesk', system-ui, sans-serif; border: 1px solid transparent; text-decoration: none; cursor: pointer; box-sizing: border-box; border-radius: 0; }
.btn-block { width: 100%; }
.btn-primary { background: var(--signal); color: var(--on-signal); border-color: var(--signal); }
.btn-secondary { background: transparent; color: var(--ink); border: 1px solid var(--edge); }
.btn-sm { min-height: 44px; padding: 0 16px; font-size: 14px; }
.btn-link { background: none; border: none; padding: 0; min-height: auto; color: var(--signal-light); font: 600 14px 'Host Grotesk', system-ui, sans-serif; text-decoration: underline; cursor: pointer; }
.btn-icon { width: 44px; height: 44px; padding: 0; background: transparent; border: 1px solid transparent; color: var(--ink); flex-shrink: 0; }
.btn:disabled, .btn-disabled { opacity: 0.45; cursor: not-allowed; }
.btn:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

.btn-row { display: flex; gap: 16px; }
.btn-row .btn { flex: 1 1 0; }

.field { display: flex; flex-direction: column; gap: 8px; }
.field-label { font: 600 14px/1.3 'Host Grotesk', system-ui, sans-serif; color: var(--ink); }
.field input { box-sizing: border-box; width: 100%; height: 48px; padding: 0 16px; font: 400 16px 'Host Grotesk', system-ui, sans-serif; color: var(--ink); background: var(--surface); border: 1px solid var(--edge); border-radius: 0; }
.field input:focus { outline: 2px solid var(--signal); outline-offset: 2px; border-color: var(--signal); }

.header { display: flex; align-items: center; gap: 4px; min-height: 56px; }
.header .t-h1 { flex: 1 1 auto; }

.chevron { color: var(--muted); flex-shrink: 0; }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

.radio-row { position: relative; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border: 1px solid var(--edge); cursor: pointer; }
.radio-row.selected { border-color: var(--signal); }
.radio-box { width: 20px; height: 20px; border: 2px solid var(--edge); flex-shrink: 0; position: relative; }
.radio-row.selected .radio-box { border-color: var(--signal); }
.radio-row.selected .radio-box::after { content: ""; position: absolute; top: 3px; left: 3px; width: 10px; height: 10px; background: var(--signal); }

.dots { display: flex; gap: 8px; align-items: center; justify-content: center; }
.dot { width: 8px; height: 8px; border: 1px solid var(--edge); background: transparent; flex-shrink: 0; }
.dot.active { border-color: var(--signal); background: var(--signal); }

.saved-hint { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }

.avatar-picker { width: 96px; height: 96px; border: 1px solid var(--edge); background: var(--surface); display: flex; align-items: center; justify-content: center; color: var(--muted); }

.setup-card { border: 1px solid var(--edge); background: var(--surface); padding: 20px; display: flex; flex-direction: column; gap: 12px; }


</style>
