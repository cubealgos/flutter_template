:root {
  --ground: #F5F6FA;

body { margin: 0; background: var(--ground); }

.list { display: flex; flex-direction: column; border-top: 1px solid var(--edge); }

.list-row-sub { font: 400 14px/1.4 'Host Grotesk', system-ui, sans-serif; color: var(--muted); }
.chevron { color: var(--muted); flex-shrink: 0; }

.checkbox-row { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.checkbox-box { width: 24px; height: 24px; border: 2px solid var(--edge); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--on-signal); border-radius: 0; }
.checkbox-box.checked { background: var(--signal); border-color: var(--signal); }
.checkbox-label { font: 400 16px/1.4 'Host Grotesk', system-ui, sans-serif; color: var(--ink); }
.checkbox-label.done { color: var(--muted); text-decoration: line-through; }

.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--edge); width: fit-content; }
.chip-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.chip-text { font: 600 14px/1.2 'Host Grotesk', system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.04em; }
.chip.success { border-color: var(--success); }
.chip.success .chip-dot { background: var(--success); }
.chip.success .chip-text { color: var(--success); }
.chip.danger { border-color: var(--danger); }
.chip.danger .chip-dot { background: var(--danger); }
.chip.danger .chip-text { color: var(--danger); }
.chip.muted .chip-dot { background: var(--muted); }
.chip.muted .chip-text { color: var(--muted); }

.divider { height: 1px; background: var(--edge); border: none; margin: 0; width: 100%; }

.code-block { background: var(--surface); border: 1px solid var(--edge); padding: 16px; font: 400 13px/1.6 'IBM Plex Mono', ui-monospace, monospace; color: var(--ink); white-space: pre; overflow: auto; }

.fact-row { display: flex; flex-direction: column; gap: 4px; padding: 12px 0; border-bottom: 1px solid var(--edge); }
.fact-row:first-child { border-top: 1px solid var(--edge); }
.fact-label { font: 600 12px/1.4 'Host Grotesk', system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.fact-value { font: 400 16px/1.5 'Host Grotesk', system-ui, sans-serif; color: var(--ink); }

.dialog-card { background: var(--surface); border: 1px solid var(--edge); padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.scrim { position: absolute; inset: 0; background: var(--scrim); }

.provider-mark { width: 44px; height: 44px; border: 1px solid var(--edge); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font: 600 15px 'Host Grotesk', system-ui, sans-serif; color: var(--muted); }
